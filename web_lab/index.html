<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMVP 模块测试台</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2538; --line:#2a3550;
    --text:#dbe4f5; --dim:#8a97b5; --accent:#4f8cff; --ok:#3fca8c; --warn:#ffb454; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh}
  aside{width:240px;min-width:240px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 10px}
  aside h1{font-size:15px;margin:0 8px 14px;color:var(--accent);letter-spacing:1px}
  .grp{font-size:11px;color:var(--dim);margin:14px 8px 6px;letter-spacing:1px}
  aside button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    padding:7px 10px;margin:2px 0;border-radius:6px;cursor:pointer;font-size:13px;line-height:1.4}
  aside button:hover{background:var(--panel2)}
  aside button.active{background:var(--accent);color:#fff}
  main{flex:1;overflow-y:auto;padding:20px 26px 60px;min-width:0}
  header h2{margin:0 0 4px;font-size:20px}
  header .desc{color:var(--dim);font-size:13px;margin:0 0 16px}
  .field{margin-bottom:12px;max-width:720px}
  .field label{display:block;font-size:13px;margin-bottom:4px;color:var(--text)}
  .field .help{font-size:11px;color:var(--dim);margin-top:3px}
  input[type=text],input[type=number],select,textarea{width:100%;max-width:520px;background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;color:var(--text);padding:7px 9px;font-size:13px}
  textarea{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
  #run{margin-top:18px;background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:10px 34px;font-size:15px;cursor:pointer;font-weight:600}
  #run:disabled{opacity:.6;cursor:wait}
  .loading{color:var(--warn);padding:18px 0}
  #result{margin-top:22px;max-width:960px}
  pre.out{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:12.5px;
    line-height:1.55;overflow:auto;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
  pre.err{background:#2a1a22;border:1px solid var(--err);color:var(--err);border-radius:8px;padding:14px;
    font-size:12.5px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
  table{border-collapse:collapse;margin:14px 0;font-size:12.5px;background:var(--panel2);border-radius:8px;overflow:hidden;max-width:100%}
  caption{text-align:left;font-size:13px;color:var(--dim);padding:6px 4px}
  th,td{border:1px solid var(--line);padding:5px 10px;text-align:left;white-space:nowrap}
  th{background:var(--panel);color:var(--dim);font-weight:600}
  .imggrid{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
  figure{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
  figure img{max-width:420px;max-height:340px;border-radius:4px;display:block}
  figcaption{font-size:12px;color:var(--dim);margin-top:6px;text-align:center}
  .meta{font-size:11px;color:var(--dim);margin-top:10px}
  #estimate{max-width:720px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;margin-bottom:18px;font-size:12.5px;line-height:1.7}
  #estimate .est-title{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:4px}
  #estimate .est-src{color:var(--dim);font-size:11px}
  #estimate .est-warn{color:var(--warn)}
  /* ---- P2: 双视图 / 链路设计器 / 命名配置 ---- */
  .tabs{display:flex;gap:6px;margin-bottom:18px}
  .tab-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:6px 16px;cursor:pointer;font-size:13px}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .preset-bar{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 0 16px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  .preset-bar input[type=text]{width:180px;max-width:180px}
  .preset-bar select{width:auto;max-width:280px}
  .preset-bar .pbar-label{color:var(--dim);font-size:12px}
  .preset-bar button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px}
  .preset-bar button:hover{background:var(--accent);color:#fff}
  .dg{display:flex;gap:16px;align-items:flex-start;max-width:1100px}
  .dg-left{width:210px;min-width:210px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px}
  .dg-left .grp{margin-top:10px}
  .dg-left button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    padding:6px 9px;margin:2px 0;border-radius:6px;cursor:pointer;font-size:12.5px}
  .dg-left button:hover{background:var(--panel2)}
  .dg-mid{flex:1;min-width:0}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
  .stage-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .stage-head b{font-size:13.5px;color:var(--accent)}
  .stage-btns button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:2px 8px;cursor:pointer;font-size:12px;margin-left:4px}
  .stage-btns button:hover{background:var(--accent);color:#fff}
  .stage-btns button.del:hover{background:var(--err);color:#fff}
  .stage-form .field{margin-bottom:8px;max-width:640px}
  .stage-form label{font-size:12px}
  .stage-form input,.stage-form select,.stage-form textarea{max-width:420px;padding:5px 8px;font-size:12px}
  .stage-preset{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .stage-preset input[type=text]{width:150px;max-width:150px;padding:4px 8px;font-size:12px}
  .stage-preset select{width:auto;max-width:260px;padding:4px 8px;font-size:12px}
  .stage-preset button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px}
  .stage-preset button:hover{background:var(--accent);color:#fff}
  .dg-tools{display:flex;gap:8px;align-items:center;margin:14px 0}
  .dg-tools input[type=number]{width:70px}
  .dg-tools button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
  .dg-tools button:hover{background:var(--accent);color:#fff}
  .dg-tools label{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .dg-scenario{max-width:720px;margin:0 0 16px}
  .dg-scenario label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:4px}
  .dg-scenario textarea{width:100%;box-sizing:border-box;min-height:56px;resize:vertical;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.5}
  #dg-estimate{margin-top:6px}
</style>
</head>
<body>
<aside>
  <h1>UMVP 测试台</h1>
  <div id="groups"></div>
</aside>
<main>
  <nav class="tabs">
    <button class="tab-btn active" data-view="module" onclick="switchView('module')">模块测试</button>
    <button class="tab-btn" data-view="designer" onclick="switchView('designer')">链路设计器</button>
  </nav>
  <section id="view-module">
    <header>
      <h2 id="mod-title">加载中…</h2>
      <p id="mod-desc" class="desc"></p>
    </header>
    <div class="preset-bar" id="preset-bar">
      <span class="pbar-label">命名配置</span>
      <input id="preset-name" type="text" placeholder="配置名（留空=模块名）">
      <button id="preset-save">保存</button>
      <select id="preset-select"></select>
      <button id="preset-load">载入</button>
      <button id="preset-delete">删除</button>
    </div>
    <div id="estimate"></div>
    <form id="form"></form>
    <button id="run" disabled>运行测试</button>
    <div id="result"></div>
  </section>
  <section id="view-designer" hidden>
    <h2>链路设计器</h2>
    <p class="desc">从模块库追加阶段 → 拼成链路 → 实时估算资源。链路生成与智能助手当前为占位（后续阶段实现）。</p>
    <div class="dg">
      <div class="dg-left">
        <div class="grp" style="margin-top:0">模块库</div>
        <div id="dg-palette"></div>
      </div>
      <div class="dg-mid">
        <div id="dg-stages"></div>
        <div class="dg-tools">
          <label>路数 <input id="dg-streams" type="number" value="1" min="1"></label>
          <button id="dg-build-btn">生成链路</button>
          <button id="dg-agent-btn">智能助手</button>
        </div>
        <div id="dg-estimate"></div>
      </div>
    </div>
    <div class="dg-scenario">
      <label>链路场景描述（可选，随链路一起保存，供智能助手参考）</label>
      <textarea id="dg-scenario" placeholder="例如：黄昏时段的园区周界，10 路摄像头，重点识别行人与车辆闯入…"></textarea>
    </div>
    <div class="preset-bar" id="dg-preset-bar" style="margin-top:16px">
      <span class="pbar-label">链路暂存</span>
      <input id="dg-preset-name" type="text" placeholder="链路配置名">
      <button id="dg-preset-save">保存链路</button>
      <select id="dg-preset-select"></select>
      <button id="dg-preset-load">载入</button>
      <button id="dg-preset-delete">删除</button>
    </div>
  </section>
</main>
<script>
"use strict";
let SCHEMA = null, current = null;

async function loadSchema(){
  const r = await fetch("/api/schema");
  SCHEMA = await r.json();
  renderSidebar();
  renderPalette();
  refreshModulePresets();
  refreshPipelinePresets();
  fetchModulePresets();
  const ids = Object.keys(SCHEMA.modules);
  if (ids.length) select(ids[0]);
}

function renderSidebar(){
  const box = document.getElementById("groups");
  box.innerHTML = "";
  const groups = {};
  for (const [id, m] of Object.entries(SCHEMA.modules)){
    (groups[m.group] = groups[m.group] || []).push([id, m]);
  }
  for (const [gn, list] of Object.entries(groups)){
    const h = document.createElement("div");
    h.className = "grp"; h.textContent = gn;
    box.appendChild(h);
    for (const [id, m] of list){
      const b = document.createElement("button");
      b.textContent = m.name; b.id = "nav-" + id;
      b.onclick = () => select(id);
      box.appendChild(b);
    }
  }
}

function select(id){
  switchView("module");
  current = id;
  const m = SCHEMA.modules[id];
  document.getElementById("mod-title").textContent = m.name;
  document.getElementById("mod-desc").textContent = m.desc || "";
  for (const b of document.querySelectorAll("#groups button")) b.classList.remove("active");
  const nav = document.getElementById("nav-" + id);
  if (nav) nav.classList.add("active");
  document.getElementById("result").innerHTML = "";
  const form = document.getElementById("form");
  form.innerHTML = "";
  for (const [pk, spec] of Object.entries(m.params)){
    form.appendChild(field(pk, spec));
  }
  renderEstimate(m.estimate);
  document.getElementById("run").disabled = false;
}

function renderEstimate(est, box){
  box = box || document.getElementById("estimate");
  if (!est || est.error){
    if (box) box.innerHTML = "";
    return;
  }
  const vram = est.vram_mb || 0, ram = est.ram_mb || 0;
  const cpu = est.latency_ms_cpu || 0, gpu = est.latency_ms_gpu || 0;
  const rows = [
    "显存 " + fmtMb(vram) + " ｜ 内存 " + fmtMb(ram),
    "单帧耗时：CPU " + fmtMs(cpu) + " ｜ GPU " + fmtMs(gpu),
  ];
  if (est.source === "measured") rows.push("来源：实测指纹");
  else if (est.source === "mixed") rows.push("来源：混合（部分实测）");
  else rows.push("来源：静态公式（未实测）");
  if (est.note) rows.push('<span class="est-src">' + esc(est.note) + "</span>");
  box.innerHTML = '<div class="est-title">📊 资源估算</div>' +
    rows.map(r => '<div>' + r + "</div>").join("");
}

function fmtMb(mb){ return mb >= 1 ? mb.toFixed(1) + " MB" : "<1 MB"; }
function fmtMs(ms){ return ms >= 1 ? ms.toFixed(1) + " ms" : "&lt;1 ms"; }
function esc(s){ const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function field(pk, spec, prefix){
  prefix = prefix || "f";
  const row = document.createElement("div");
  row.className = "field";
  const lab = document.createElement("label");
  lab.textContent = spec.label;
  lab.htmlFor = prefix + "-" + pk;
  row.appendChild(lab);
  row.appendChild(renderInput(pk, spec, prefix));
  if (spec.help){
    const h = document.createElement("div");
    h.className = "help"; h.textContent = spec.help;
    row.appendChild(h);
  }
  return row;
}

function renderInput(pk, spec, prefix){
  prefix = prefix || "f";
  let el;
  if (spec.type === "select"){
    el = document.createElement("select");
    el.id = prefix + "-" + pk;
    for (const o of spec.options){
      const op = document.createElement("option");
      op.value = o; op.textContent = o;
      el.appendChild(op);
    }
    el.value = spec.default !== undefined ? String(spec.default) : spec.options[0];
  } else if (spec.type === "bool"){
    el = document.createElement("input");
    el.type = "checkbox"; el.id = prefix + "-" + pk;
    el.checked = !!spec.default;
  } else if (spec.type === "text"){
    el = document.createElement("textarea");
    el.id = prefix + "-" + pk; el.rows = spec.rows || 5;
    el.value = spec.default || "";
    if (spec.placeholder) el.placeholder = spec.placeholder;
  } else if (spec.type === "file"){
    el = document.createElement("select");
    el.id = prefix + "-" + pk;
    const files = SCHEMA.files[spec.src] || [];
    if (!files.length){
      const op = document.createElement("option");
      op.value = ""; op.textContent = "(目录无文件)";
      el.appendChild(op);
    }
    for (const f of files){
      const op = document.createElement("option");
      op.value = f; op.textContent = f;
      el.appendChild(op);
    }
    if (spec.default && files.includes(spec.default)) el.value = spec.default;
  } else {
    el = document.createElement("input");
    el.id = prefix + "-" + pk;
    el.type = (spec.type === "int" || spec.type === "float") ? "number" : "text";
    if (spec.type === "float") el.step = "any";
    el.value = spec.default !== undefined && spec.default !== null ? String(spec.default) : "";
  }
  el.dataset.name = pk;
  el.dataset.type = spec.type;
  return el;
}

function collect(scope){
  const out = {};
  (scope || document.getElementById("form")).querySelectorAll("[data-name]").forEach(el => {
    const k = el.dataset.name, t = el.dataset.type;
    if (t === "bool") out[k] = el.checked;
    else out[k] = el.value;
  });
  return out;
}

function fillForm(scope, params){
  for (const [k, v] of Object.entries(params || {})){
    const el = scope.querySelector('[data-name="' + k + '"]');
    if (!el) continue;
    if (el.dataset.type === "bool") el.checked = !!v;
    else el.value = v === null || v === undefined ? "" : String(v);
  }
}

async function run(){
  if (!current) return;
  const btn = document.getElementById("run");
  btn.disabled = true; btn.textContent = "运行中…（模型加载首次较慢）";
  const box = document.getElementById("result");
  box.innerHTML = '<div class="loading">⏳ 运行中，请稍候…</div>';
  try{
    const resp = await fetch("/api/test/" + current, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({params: collect()})
    });
    renderResult(await resp.json());
  }catch(e){
    box.innerHTML = '<pre class="err">请求失败: ' + e + '</pre>';
  }
  btn.disabled = false; btn.textContent = "运行测试";
}

function renderResult(data){
  const box = document.getElementById("result");
  box.innerHTML = "";
  if (data.elapsed_sec !== undefined){
    const m = document.createElement("div");
    m.className = "meta"; m.textContent = "本次耗时: " + data.elapsed_sec + "s";
    box.appendChild(m);
  }
  if (!data.ok || data.error){
    const pre = document.createElement("pre");
    pre.className = "err";
    pre.textContent = "❌ " + (data.error || "未知错误");
    box.appendChild(pre);
    if (data.traceback){
      const pre2 = document.createElement("pre");
      pre2.className = "err"; pre2.textContent = data.traceback;
      box.appendChild(pre2);
    }
  }
  if (data.text){
    const pre = document.createElement("pre");
    pre.className = "out"; pre.textContent = data.text;
    box.appendChild(pre);
  }
  for (const t of data.tables || []){
    const tb = document.createElement("table");
    const cap = document.createElement("caption"); cap.textContent = t.title;
    tb.appendChild(cap);
    const thead = document.createElement("thead");
    const trh = document.createElement("tr");
    for (const h of t.headers){
      const th = document.createElement("th"); th.textContent = h; trh.appendChild(th);
    }
    thead.appendChild(trh); tb.appendChild(thead);
    const tbody = document.createElement("tbody");
    for (const row of t.rows){
      const tr = document.createElement("tr");
      for (const c of row){
        const td = document.createElement("td"); td.textContent = c; tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    tb.appendChild(tbody);
    box.appendChild(tb);
  }
  const grid = document.createElement("div");
  grid.className = "imggrid";
  for (const im of data.images || []){
    const fig = document.createElement("figure");
    const img = document.createElement("img");
    img.src = im.data; img.alt = im.title || ""; img.loading = "lazy";
    const cap = document.createElement("figcaption"); cap.textContent = im.title || "";
    fig.appendChild(img); fig.appendChild(cap);
    grid.appendChild(fig);
  }
  if (grid.children.length) box.appendChild(grid);
}

// ---------------- P2：双视图 / 链路设计器 / 命名配置 ----------------

function switchView(name){
  document.getElementById("view-module").hidden = name !== "module";
  document.getElementById("view-designer").hidden = name !== "designer";
  for (const b of document.querySelectorAll(".tab-btn"))
    b.classList.toggle("active", b.dataset.view === name);
}

async function apiPost(path, body){
  const r = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {})
  });
  return r.json();
}

// ---- 命名配置：模块视图 ----
function refreshModulePresets(){
  return fetch("/api/presets?kind=module").then(r => r.json()).then(data => {
    const sel = document.getElementById("preset-select");
    sel.innerHTML = "";
    if (!data.ok){
      const op = document.createElement("option");
      op.textContent = "(数据库不可用)";
      sel.appendChild(op);
      return;
    }
    for (const p of data.presets){
      const op = document.createElement("option");
      op.value = p.id;
      const m = SCHEMA.modules[p.module_id];
      op.textContent = "[" + (m ? m.name : p.module_id) + "] " + p.name;
      sel.appendChild(op);
    }
  }).catch(() => {});
}

async function saveModulePreset(){
  const name = document.getElementById("preset-name").value.trim() || SCHEMA.modules[current].name;
  const data = await apiPost("/api/presets/save",
    {kind: "module", name, module_id: current, params: collect()});
  alert(data.ok ? (name + "：" + (data.note || "已保存")) : ("保存失败：" + (data.error || "")));
  refreshModulePresets();
}

async function loadModulePreset(){
  const sel = document.getElementById("preset-select");
  if (!sel.value) return;
  const data = await apiPost("/api/presets/load", {id: parseInt(sel.value)});
  if (!data.ok){ alert("载入失败：" + (data.error || "")); return; }
  const p = data.preset;
  if (p.module_id && p.module_id !== current) select(p.module_id);
  fillForm(document.getElementById("form"), p.params);
  try{  // 估算随载入参数更新
    const r = await fetch("/api/pipeline/estimate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({stages: [{module: p.module_id || current, params: collect()}]})});
    const est = await r.json();
    if (est.ok) renderEstimate(est.estimate);
  }catch(e){}
}

async function deleteModulePreset(){
  const sel = document.getElementById("preset-select");
  if (!sel.value) return;
  const data = await apiPost("/api/presets/delete", {id: parseInt(sel.value)});
  if (!data.ok) alert("删除失败：" + (data.error || ""));
  refreshModulePresets();
}

// ---- 链路设计器 ----
let STAGES = [];

function renderPalette(){
  const box = document.getElementById("dg-palette");
  box.innerHTML = "";
  const groups = {};
  for (const [id, m] of Object.entries(SCHEMA.modules))
    (groups[m.group] = groups[m.group] || []).push([id, m]);
  for (const [gn, list] of Object.entries(groups)){
    const h = document.createElement("div");
    h.className = "grp"; h.textContent = gn;
    box.appendChild(h);
    for (const [id, m] of list){
      const b = document.createElement("button");
      b.textContent = m.name; b.title = m.desc || "";
      b.onclick = () => { addStage(id); dgEstimate(); };
      box.appendChild(b);
    }
  }
}

// ---- 阶段"按名载入配置"（kind=module，共享一次拉取） ----
let MODULE_PRESETS = [];

async function fetchModulePresets(){
  try{
    const r = await fetch("/api/presets?kind=module");
    const d = await r.json();
    MODULE_PRESETS = d.ok ? (d.presets || []) : [];
  }catch(e){ MODULE_PRESETS = []; }
}

// 按检索词（配置名/模块名包含）过滤，最多显示 10 条
function renderStagePresetSel(q, sel){
  const kw = (q.value || "").trim().toLowerCase();
  const mods = SCHEMA.modules;
  let list = MODULE_PRESETS;
  if (kw) list = list.filter(p =>
    p.name.toLowerCase().includes(kw) ||
    (mods[p.module_id] && mods[p.module_id].name.toLowerCase().includes(kw)));
  sel.innerHTML = "";
  for (const p of list.slice(0, 10)){
    const m = mods[p.module_id];
    const op = document.createElement("option");
    op.value = p.id;
    op.textContent = "[" + (m ? m.name : p.module_id) + "] " + p.name;
    sel.appendChild(op);
  }
  if (!sel.options.length){
    const op = document.createElement("option");
    op.value = ""; op.textContent = "(无匹配配置)";
    sel.appendChild(op);
  }
}

function addStage(mid, params){
  const m = SCHEMA.modules[mid];
  const el = document.createElement("div");
  el.className = "stage";
  const head = document.createElement("div");
  head.className = "stage-head";
  const title = document.createElement("b");
  title.textContent = m ? m.name : mid;
  const btns = document.createElement("span");
  btns.className = "stage-btns";
  btns.innerHTML = '<button data-a="fold" title="收起/展开">▾</button>' +
    '<button data-a="up" title="上移">↑</button>' +
    '<button data-a="down" title="下移">↓</button>' +
    '<button data-a="del" class="del" title="删除">✕</button>';
  head.appendChild(title); head.appendChild(btns);
  el.appendChild(head);
  const pr = document.createElement("div");
  pr.className = "stage-preset";
  pr.innerHTML = '<input type="text" class="sp-q" placeholder="按配置名检索…">' +
    '<select class="sp-sel"></select>' +
    '<button type="button" data-a="preset-load" title="把选中配置的参数载入本阶段">载入</button>';
  const q = pr.querySelector(".sp-q"), sel = pr.querySelector(".sp-sel");
  renderStagePresetSel(q, sel);
  q.addEventListener("input", () => renderStagePresetSel(q, sel));
  el.appendChild(pr);
  if (m){
    const form = document.createElement("div");
    form.className = "stage-form";
    for (const [pk, spec] of Object.entries(m.params))
      form.appendChild(field(pk, spec, "s" + STAGES.length + "-" + pk));
    el.appendChild(form);
  }
  document.getElementById("dg-stages").appendChild(el);
  STAGES.push({module: mid, el});
  if (params) fillForm(el, params);
  return el;
}

function renderStages(list){
  const box = document.getElementById("dg-stages");
  box.innerHTML = "";
  STAGES = [];
  for (const s of list || []) addStage(s.module, s.params);
}

function snapshot(){
  return STAGES.map(s => ({module: s.module, params: collect(s.el)}));
}

function dgBuildSpec(){
  return {
    name: "临时链路",
    description: document.getElementById("dg-scenario").value.trim(),
    stages: STAGES.map(s => ({module: s.module, params: collect(s.el)})),
    streams: parseInt(document.getElementById("dg-streams").value) || 1
  };
}

let dgTimer = null;
function dgEstimate(){
  const box = document.getElementById("dg-estimate");
  if (!STAGES.length){ box.innerHTML = ""; return; }
  clearTimeout(dgTimer);
  dgTimer = setTimeout(async () => {
    try{
      const r = await fetch("/api/pipeline/estimate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(dgBuildSpec())});
      const data = await r.json();
      if (!data.ok){
        box.innerHTML = '<pre class="err">' + esc(data.error || "估算失败") + "</pre>";
        return;
      }
      renderEstimate(data.estimate, box);
    }catch(e){
      box.innerHTML = '<pre class="err">' + esc("请求失败: " + e) + "</pre>";
    }
  }, 400);
}

async function stubBuild(){
  const data = await apiPost("/api/pipeline/build", dgBuildSpec());
  alert(data.note || data.error || "（占位）");
}

async function stubAgent(){
  const data = await apiPost("/api/pipeline/agent", {spec: dgBuildSpec()});
  alert(data.note || data.error || "（占位）");
}

// ---- 命名配置：链路暂存 ----
function refreshPipelinePresets(){
  return fetch("/api/presets?kind=pipeline").then(r => r.json()).then(data => {
    const sel = document.getElementById("dg-preset-select");
    sel.innerHTML = "";
    if (!data.ok){
      const op = document.createElement("option");
      op.textContent = "(数据库不可用)";
      sel.appendChild(op);
      return;
    }
    for (const p of data.presets){
      const op = document.createElement("option");
      op.value = p.id; op.textContent = p.name;
      sel.appendChild(op);
    }
  }).catch(() => {});
}

async function savePipelinePreset(){
  const name = document.getElementById("dg-preset-name").value.trim();
  if (!name){ alert("请先填写链路配置名"); return; }
  const data = await apiPost("/api/presets/save", {kind: "pipeline", name, params: dgBuildSpec()});
  alert(data.ok ? (name + "：" + (data.note || "已保存")) : ("保存失败：" + (data.error || "")));
  refreshPipelinePresets();
}

async function loadPipelinePreset(){
  const sel = document.getElementById("dg-preset-select");
  if (!sel.value) return;
  const data = await apiPost("/api/presets/load", {id: parseInt(sel.value)});
  if (!data.ok){ alert("载入失败：" + (data.error || "")); return; }
  const spec = data.preset.params || {};
  renderStages(spec.stages || []);
  if (spec.streams) document.getElementById("dg-streams").value = spec.streams;
  const d = document.getElementById("dg-scenario");
  if (d) d.value = spec.description || "";
  dgEstimate();
}

async function deletePipelinePreset(){
  const sel = document.getElementById("dg-preset-select");
  if (!sel.value) return;
  const data = await apiPost("/api/presets/delete", {id: parseInt(sel.value)});
  if (!data.ok) alert("删除失败：" + (data.error || ""));
  refreshPipelinePresets();
}

// ---- 事件绑定 ----
document.getElementById("run").addEventListener("click", run);
document.getElementById("preset-save").addEventListener("click", saveModulePreset);
document.getElementById("preset-load").addEventListener("click", loadModulePreset);
document.getElementById("preset-delete").addEventListener("click", deleteModulePreset);
document.getElementById("dg-stages").addEventListener("click", e => {
  const btn = e.target.closest("button[data-a]");
  if (!btn) return;
  const stageEl = btn.closest(".stage");
  const i = STAGES.findIndex(s => s.el === stageEl);
  if (i < 0) return;
  const a = btn.dataset.a;
  if (a === "fold"){
    const f = stageEl.querySelector(".stage-form");
    if (f){ f.hidden = !f.hidden; btn.textContent = f.hidden ? "▸" : "▾"; }
    return;
  }
  if (a === "preset-load"){
    const sel = stageEl.querySelector(".sp-sel");
    if (!sel || !sel.value) return;
    apiPost("/api/presets/load", {id: parseInt(sel.value)}).then(d => {
      if (!d.ok){ alert("载入失败：" + (d.error || "")); return; }
      fillForm(stageEl, d.preset.params);
      dgEstimate();
    });
    return;
  }
  const list = snapshot();
  if (a === "del") list.splice(i, 1);
  else if (a === "up" && i > 0){ const t = list[i - 1]; list[i - 1] = list[i]; list[i] = t; }
  else if (a === "down" && i < list.length - 1){ const t = list[i + 1]; list[i + 1] = list[i]; list[i] = t; }
  renderStages(list);
  dgEstimate();
});
document.getElementById("dg-stages").addEventListener("input", dgEstimate);
document.getElementById("dg-streams").addEventListener("input", dgEstimate);
document.getElementById("dg-build-btn").addEventListener("click", stubBuild);
document.getElementById("dg-agent-btn").addEventListener("click", stubAgent);
document.getElementById("dg-preset-save").addEventListener("click", savePipelinePreset);
document.getElementById("dg-preset-load").addEventListener("click", loadPipelinePreset);
document.getElementById("dg-preset-delete").addEventListener("click", deletePipelinePreset);

loadSchema();
</script>
</body>
