<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMVP 模块测试台</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2538; --line:#2a3550;
    --text:#dbe4f5; --dim:#8a97b5; --accent:#4f8cff; --ok:#3fca8c; --warn:#ffb454; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh}
  aside{width:240px;min-width:240px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 10px}
  aside h1{font-size:15px;margin:0 8px 14px;color:var(--accent);letter-spacing:1px}
  .grp{font-size:11px;color:var(--dim);margin:14px 8px 6px;letter-spacing:1px}
  aside button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    padding:7px 10px;margin:2px 0;border-radius:6px;cursor:pointer;font-size:13px;line-height:1.4}
  aside button:hover{background:var(--panel2)}
  aside button.active{background:var(--accent);color:#fff}
  aside input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;color:var(--text);padding:6px 9px;font-size:12px;margin:0 0 6px}
  main{flex:1;overflow-y:auto;padding:20px 26px 60px;min-width:0}
  header h2{margin:0 0 4px;font-size:20px}
  header .desc{color:var(--dim);font-size:13px;margin:0 0 16px}
  .field{margin-bottom:12px;max-width:720px}
  .field label{display:block;font-size:13px;margin-bottom:4px;color:var(--text)}
  .field .help{font-size:11px;color:var(--dim);margin-top:3px}
  .test-divider{margin:18px 0 10px;padding:6px 10px;max-width:720px;border-top:1px dashed var(--dim);
                font-size:12px;color:var(--dim);background:rgba(127,127,127,.06);border-radius:4px}
  .param-group{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    margin-bottom:10px;max-width:720px}
  .param-group summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;
    color:var(--accent);user-select:none;list-style:none}
  .param-group summary::before{content:"▾ ";font-size:11px}
  .param-group:not([open]) summary::before{content:"▸ "}
  .param-group summary::-webkit-details-marker{display:none}
  .param-group .fields{padding:2px 12px 10px}
  input[type=text],input[type=number],select,textarea{width:100%;max-width:520px;background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;color:var(--text);padding:7px 9px;font-size:13px}
  textarea{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
  #run{margin-top:18px;background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:10px 34px;font-size:15px;cursor:pointer;font-weight:600}
  #run:disabled{opacity:.6;cursor:wait}
  .loading{color:var(--warn);padding:18px 0}
  #result{margin-top:22px;max-width:960px}
  pre.out{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:12.5px;
    line-height:1.55;overflow:auto;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
  pre.err{background:#2a1a22;border:1px solid var(--err);color:var(--err);border-radius:8px;padding:14px;
    font-size:12.5px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
  table{border-collapse:collapse;margin:14px 0;font-size:12.5px;background:var(--panel2);border-radius:8px;overflow:hidden;max-width:100%}
  caption{text-align:left;font-size:13px;color:var(--dim);padding:6px 4px}
  th,td{border:1px solid var(--line);padding:5px 10px;text-align:left;white-space:nowrap}
  th{background:var(--panel);color:var(--dim);font-weight:600}
  .imggrid{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
  figure{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
  figure img{max-width:420px;max-height:340px;border-radius:4px;display:block}
  figcaption{font-size:12px;color:var(--dim);margin-top:6px;text-align:center}
  .meta{font-size:11px;color:var(--dim);margin-top:10px}
  #estimate{max-width:720px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;margin-bottom:18px;font-size:12.5px;line-height:1.7}
  #estimate .est-title{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:4px}
  #estimate .est-src{color:var(--dim);font-size:11px}
  #estimate .est-warn{color:var(--warn)}
  /* ---- P2: 双视图 / 链路设计器 / 命名配置 ---- */
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .tab-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:6px 16px;cursor:pointer;font-size:13px}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .preset-bar{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 0 16px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  .preset-bar input[type=text]{width:180px;max-width:180px}
  .preset-bar select{width:auto;max-width:280px}
  .preset-bar .pbar-label{color:var(--dim);font-size:12px}
  .preset-bar button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12.5px}
  .preset-bar button:hover{background:var(--accent);color:#fff}
  .dg{display:flex;gap:16px;align-items:flex-start;max-width:1100px}
  .dg-left{width:210px;min-width:210px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px}
  .dg-left .grp{margin-top:10px}
  .dg-left button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    padding:6px 9px;margin:2px 0;border-radius:6px;cursor:pointer;font-size:12.5px}
  .dg-left button:hover{background:var(--panel2)}
  .dg-mid{flex:1;min-width:0}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
  .stage-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .stage-head b{font-size:13.5px;color:var(--accent)}
  .stage-btns button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:2px 8px;cursor:pointer;font-size:12px;margin-left:4px}
  .stage-btns button:hover{background:var(--accent);color:#fff}
  .stage-btns button.del:hover{background:var(--err);color:#fff}
  .stage-form .field{margin-bottom:8px;max-width:640px}
  .stage-form label{font-size:12px}
  .stage-form input,.stage-form select,.stage-form textarea{max-width:420px;padding:5px 8px;font-size:12px}
  .stage-wiring{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
  .stage-wiring .wiring-title{font-size:12px;color:var(--dim);margin-bottom:5px}
  .stage-wiring .wiring-row{display:flex;gap:8px;align-items:center;margin-bottom:5px;max-width:640px}
  .stage-wiring .wiring-row label{font-size:12px;min-width:110px;color:var(--text)}
  .stage-wiring .wiring-row select{flex:1;max-width:360px;padding:4px 8px;font-size:12px}
  .stage-wiring .wiring-note{font-size:11.5px;color:var(--dim);line-height:1.6}
  .stage-preset{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .stage-preset input[type=text]{width:150px;max-width:150px;padding:4px 8px;font-size:12px}
  .stage-preset select{width:auto;max-width:260px;padding:4px 8px;font-size:12px}
  .stage-preset button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px}
  .stage-preset button:hover{background:var(--accent);color:#fff}
  .dg-tools{display:flex;gap:8px;align-items:center;margin:14px 0}
  .dg-tools input[type=number]{width:70px}
  .dg-tools button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
  .dg-tools button:hover{background:var(--accent);color:#fff}
  .dg-tools label{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .dg-scenario{max-width:720px;margin:0 0 16px}
  .dg-scenario label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:4px}
  .dg-scenario textarea{width:100%;box-sizing:border-box;min-height:56px;resize:vertical;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.5}
  #dg-estimate{margin-top:6px}
  /* ---- 挂载 agent：智能助手抽屉 ---- */
  .agent-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;justify-content:flex-end}
  .agent-overlay[hidden]{display:none}
  .agent-panel{width:520px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;height:100vh}
  .agent-head{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:12px 16px;border-bottom:1px solid var(--line)}
  .agent-head b{color:var(--accent);font-size:14px}
  .agent-head select{width:auto;max-width:200px;padding:4px 8px;font-size:12px}
  .agent-head button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:4px 10px;cursor:pointer}
  .agent-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .agent-msg{max-width:88%;padding:8px 11px;border-radius:8px;font-size:13px;line-height:1.6;
    white-space:pre-wrap;word-break:break-word}
  .agent-msg.user{align-self:flex-end;background:var(--accent);color:#fff}
  .agent-msg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .agent-msg.meta{align-self:flex-start;color:var(--dim);font-size:11.5px;padding:2px 4px}
  .agent-msg.err{align-self:flex-start;background:#2a1a22;border:1px solid var(--err);color:var(--err)}
  .agent-input{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .agent-input textarea{flex:1;min-height:44px;max-height:120px;resize:vertical;
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:8px;font-size:13px}
  .agent-input button{background:var(--accent);color:#fff;border:none;border-radius:6px;
    padding:0 18px;cursor:pointer;font-weight:600}
  .agent-input button:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<aside>
  <h1>UMVP 测试台</h1>
  <div id="groups"></div>
  <div class="grp">链路设计器</div>
  <button id="nav-designer" onclick="openDesigner()">链路设计器</button>
  <div class="grp">系统</div>
  <button id="nav-test" onclick="openTestPage()">链路测试台</button>
  <button id="nav-db" onclick="openDb()">数据浏览</button>
</aside>
<main>
  <section id="view-module">
    <header>
      <h2 id="mod-title">加载中…</h2>
      <p id="mod-desc" class="desc"></p>
    </header>
    <div class="preset-bar" id="preset-bar">
      <span class="pbar-label">命名配置</span>
      <input id="preset-name" type="text" placeholder="配置名（留空=模块名）">
      <button id="preset-save">保存</button>
      <select id="preset-select"></select>
      <button id="preset-load">载入</button>
      <button id="preset-delete">删除</button>
    </div>
    <div id="estimate"></div>
    <form id="form"></form>
    <button id="run" disabled>运行测试</button>
    <div id="result"></div>
  </section>
  <section id="view-designer" hidden>
    <h2>链路设计器</h2>
    <p class="desc">从模块库追加阶段 → 拼成链路 → 实时估算资源。链路生成与智能助手当前为占位（后续阶段实现）。</p>
    <div class="dg">
      <div class="dg-left">
        <div class="grp" style="margin-top:0">模块库</div>
        <div id="dg-palette"></div>
      </div>
      <div class="dg-mid">
        <div id="dg-stages"></div>
        <div class="dg-tools">
          <label>路数 <input id="dg-streams" type="number" value="1" min="1"></label>
          <button id="dg-build-btn">生成链路</button>
          <button id="dg-agent-btn">智能助手</button>
        </div>
        <div id="dg-estimate"></div>
      </div>
    </div>
    <div class="dg-scenario">
      <label>链路场景描述（可选，随链路一起保存，供智能助手参考）</label>
      <textarea id="dg-scenario" placeholder="例如：黄昏时段的园区周界，10 路摄像头，重点识别行人与车辆闯入…"></textarea>
    </div>
    <div class="preset-bar" id="dg-preset-bar" style="margin-top:16px">
      <span class="pbar-label">链路暂存</span>
      <input id="dg-preset-name" type="text" placeholder="链路配置名">
      <button id="dg-preset-save">保存链路</button>
      <select id="dg-preset-select"></select>
      <button id="dg-preset-load">载入</button>
      <button id="dg-preset-delete">删除</button>
    </div>
  </section>
  <section id="view-db" hidden>
    <h2>数据库数据浏览</h2>
    <p class="desc">只读查看 MySQL 中各表的当前内容：presets 注册表、各模块参数表（列式存储）、链路与步骤。改数据请走"模块测试 / 链路设计器"的暂存界面。</p>
    <div id="db-summary"></div>
    <div class="tabs" id="db-tabs"></div>
    <div id="db-content"></div>
  </section>
</main>
<div class="agent-overlay" id="agent-overlay" hidden>
  <div class="agent-panel">
    <div class="agent-head">
      <b>智能助手</b>
      <select id="agent-role" title="角色">
        <option value="architect">总装工（需求＋业务设计）</option>
        <option value="assembler">组装工（拼接＋参数）</option>
      </select>
      <button onclick="closeAgent()">关闭</button>
    </div>
    <div class="agent-log" id="agent-log">
      <div class="agent-msg meta">用自然语言描述需求或提问：总装工负责整理需求与业务层链路设计，
组装工负责落成 spec 与具体参数。</div>
    </div>
    <div class="agent-input">
      <textarea id="agent-input" placeholder="例如：16 路 1080p、8G 显存，检测停车场拥堵并告警"></textarea>
      <button id="agent-send" onclick="sendAgent()">发送</button>
    </div>
  </div>
</div>
<script>
"use strict";
let SCHEMA = null, current = null;

async function loadSchema(){
  const r = await fetch("/api/schema");
  SCHEMA = await r.json();
  renderSidebar();
  renderPalette();
  refreshModulePresets();
  refreshPipelinePresets();
  fetchModulePresets();
  const ids = Object.keys(SCHEMA.modules).filter(id => !SCHEMA.modules[id].hidden);
  if (ids.length) select(ids[0]);
}

function renderSidebar(){
  const box = document.getElementById("groups");
  box.innerHTML = "";
  const groups = {};
  for (const [id, m] of Object.entries(SCHEMA.modules)){
    if (m.hidden) continue;
    (groups[m.group] = groups[m.group] || []).push([id, m]);
  }
  for (const [gn, list] of Object.entries(groups)){
    const h = document.createElement("div");
    h.className = "grp"; h.textContent = gn;
    box.appendChild(h);
    for (const [id, m] of list){
      const b = document.createElement("button");
      b.textContent = m.name; b.id = "nav-" + id;
      b.onclick = () => select(id);
      box.appendChild(b);
    }
  }
}

function openDb(){
  switchView("db");
  setNavActive("db");
}

function openTestPage(){
  window.location.href = "test.html";
}

function openDesigner(){
  switchView("designer");
  setNavActive("designer");
}

function setNavActive(id){
  for (const b of document.querySelectorAll("#groups button"))
    b.classList.toggle("active", b.id === "nav-" + id);
  const d = document.getElementById("nav-designer");
  if (d) d.classList.toggle("active", id === "designer");
  const db = document.getElementById("nav-db");
  if (db) db.classList.toggle("active", id === "db");
  const test = document.getElementById("nav-test");
  if (test) test.classList.toggle("active", id === "test");
}

function select(id){
  switchView("module");
  setNavActive(id);
  current = id;
  modulePresetId = null;
  const m = SCHEMA.modules[id];
  document.getElementById("mod-title").textContent = m.name;
  document.getElementById("mod-desc").textContent = m.desc || "";
  document.getElementById("result").innerHTML = "";
  const form = document.getElementById("form");
  form.innerHTML = "";
  // 模块参数 与 测试参数 分区：后者仅本页运行用（不落库、不进链路设计器）
  const own = [], test = [];
  for (const [pk, spec] of Object.entries(m.params))
    (spec.test_only ? test : own).push([pk, spec]);
  for (const [pk, spec] of own) form.appendChild(field(pk, spec));
  if (test.length){
    const div = document.createElement("div");
    div.className = "test-divider";
    div.textContent = "▽ 测试参数（仅本页运行用，不存库、不进链路）";
    form.appendChild(div);
    for (const [pk, spec] of test) form.appendChild(field(pk, spec));
  }
  applyShowIf(form);
  form.oninput = () => applyShowIf(form);
  form.onchange = () => applyShowIf(form);
  renderEstimate(m.estimate);
  document.getElementById("run").disabled = false;
  refreshModulePresets();
}

function renderEstimate(est, box){
  box = box || document.getElementById("estimate");
  if (!est || est.error){
    if (box) box.innerHTML = "";
    return;
  }
  const vram = est.vram_mb || 0, ram = est.ram_mb || 0;
  const cpu = est.latency_ms_cpu || 0, gpu = est.latency_ms_gpu || 0;
  const rows = [
    "显存 " + fmtMb(vram) + " ｜ 内存 " + fmtMb(ram),
    "单帧耗时：CPU " + fmtMs(cpu) + " ｜ GPU " + fmtMs(gpu),
  ];
  if (est.source === "measured") rows.push("来源：实测指纹");
  else if (est.source === "mixed") rows.push("来源：混合（部分实测）");
  else rows.push("来源：静态公式（未实测）");
  if (est.note) rows.push('<span class="est-src">' + esc(est.note) + "</span>");
  box.innerHTML = '<div class="est-title">📊 资源估算</div>' +
    rows.map(r => '<div>' + r + "</div>").join("");
}

function fmtMb(mb){ return mb >= 1 ? mb.toFixed(1) + " MB" : "<1 MB"; }
function fmtMs(ms){ return ms >= 1 ? ms.toFixed(1) + " ms" : "&lt;1 ms"; }
function esc(s){ const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function field(pk, spec, prefix){
  prefix = prefix || "f";
  const row = document.createElement("div");
  row.className = "field";
  const lab = document.createElement("label");
  lab.textContent = spec.label;
  lab.htmlFor = prefix + "-" + pk;
  row.appendChild(lab);
  row.appendChild(renderInput(pk, spec, prefix));
  if (spec.help){
    const h = document.createElement("div");
    h.className = "help"; h.textContent = spec.help;
    row.appendChild(h);
  }
  if (spec.show_if) row.dataset.showIf = JSON.stringify(spec.show_if);  // 按其他字段值联动显隐
  return row;
}

// 按 show_if 联动显隐：条件形如 {key:"kind", in:["window"]} 或 {key:"x", eq:"y"}
function applyShowIf(scope){
  scope.querySelectorAll("[data-show-if]").forEach(row => {
    let cond;
    try { cond = JSON.parse(row.dataset.showIf); } catch(e){ return; }
    const ctrl = scope.querySelector('[data-name="' + cond.key + '"]');
    if (!ctrl){ row.hidden = false; return; }
    const v = ctrl.type === "checkbox" ? (ctrl.checked ? "true" : "false") : ctrl.value;
    let show = true;
    if (cond["in"] !== undefined) show = cond["in"].map(String).includes(String(v));
    else if (cond["eq"] !== undefined) show = String(cond["eq"]) === String(v);
    row.hidden = !show;
  });
}

function renderInput(pk, spec, prefix){
  prefix = prefix || "f";
  let el;
  if (spec.type === "select"){
    el = document.createElement("select");
    el.id = prefix + "-" + pk;
    for (const o of spec.options){
      const op = document.createElement("option");
      op.value = o; op.textContent = o;
      el.appendChild(op);
    }
    el.value = spec.default !== undefined ? String(spec.default) : spec.options[0];
  } else if (spec.type === "bool"){
    el = document.createElement("input");
    el.type = "checkbox"; el.id = prefix + "-" + pk;
    el.checked = !!spec.default;
  } else if (spec.type === "text"){
    el = document.createElement("textarea");
    el.id = prefix + "-" + pk; el.rows = spec.rows || 5;
    el.value = spec.default || "";
    if (spec.placeholder) el.placeholder = spec.placeholder;
  } else if (spec.type === "file"){
    el = document.createElement("select");
    el.id = prefix + "-" + pk;
    const files = SCHEMA.files[spec.src] || [];
    if (!files.length){
      const op = document.createElement("option");
      op.value = ""; op.textContent = "(目录无文件)";
      el.appendChild(op);
    }
    for (const f of files){
      const op = document.createElement("option");
      op.value = f; op.textContent = f;
      el.appendChild(op);
    }
    if (spec.default && files.includes(spec.default)) el.value = spec.default;
  } else {
    el = document.createElement("input");
    el.id = prefix + "-" + pk;
    el.type = (spec.type === "int" || spec.type === "float") ? "number" : "text";
    if (spec.type === "float") el.step = "any";
    el.value = spec.default !== undefined && spec.default !== null ? String(spec.default) : "";
  }
  el.dataset.name = pk;
  el.dataset.type = spec.type;
  el.dataset.default = (spec.default !== undefined && spec.default !== null)
    ? String(spec.default) : "";
  return el;
}

function collect(scope){
  const out = {};
  (scope || document.getElementById("form")).querySelectorAll("[data-name]").forEach(el => {
    const k = el.dataset.name, t = el.dataset.type;
    if (t === "bool"){ out[k] = el.checked; return; }
    // 空值回落 schema 默认（避免保存出全 None 导致的运行时 0 报送）
    let v = el.value;
    if (v === "" ) v = el.dataset.default || "";
    out[k] = v;
  });
  return out;
}

function fillForm(scope, params){
  for (const [k, v] of Object.entries(params || {})){
    const el = scope.querySelector('[data-name="' + k + '"]');
    if (!el) continue;
    if (el.dataset.type === "bool") el.checked = !!v;
    else el.value = v === null || v === undefined ? "" : String(v);
  }
}

function renderGroupedForm(container, moduleId, values, prefix){
  prefix = prefix || "pl";
  const mod = SCHEMA.modules[moduleId];
  if (!mod) return;
  const groups = {};
  for (const [pk, s] of Object.entries(mod.params)){
    const g = s.group || "参数";
    (groups[g] = groups[g] || []).push([pk, s]);
  }
  for (const [gname, list] of Object.entries(groups)){
    const d = document.createElement("details");
    d.className = "param-group"; d.open = true;
    const sum = document.createElement("summary");
    sum.textContent = gname;
    d.appendChild(sum);
    const f = document.createElement("div");
    f.className = "fields";
    for (const [pk, s] of list) f.appendChild(field(pk, s, prefix));
    d.appendChild(f);
    container.appendChild(d);
  }
  fillForm(container, values);
}

async function run(){
  if (!current) return;
  const btn = document.getElementById("run");
  btn.disabled = true; btn.textContent = "运行中…（模型加载首次较慢）";
  const box = document.getElementById("result");

    });

function renderResult(data, box){
  box = box || document.getElementById("result");
  box.innerHTML = "";
  if (data.elapsed_sec !== undefined){
    const m = document.createElement("div");
    m.className = "meta"; m.textContent = "本次耗时: " + data.elapsed_sec + "s";
    box.appendChild(m);
  }
  if (!data.ok || data.error){
    const pre = document.createElement("pre");
    pre.className = "err";
    pre.textContent = "❌ " + (data.error || "未知错误");
    box.appendChild(pre);
    if (data.traceback){
      const pre2 = document.createElement("pre");
      pre2.className = "err"; pre2.textContent = data.traceback;
      box.appendChild(pre2);
    }
  }
  if (data.text){
    const pre = document.createElement("pre");
    pre.className = "out"; pre.textContent = data.text;
    box.appendChild(pre);
  }
  for (const t of data.tables || []){
    const tb = document.createElement("table");
    const cap = document.createElement("caption"); cap.textContent = t.title;
    tb.appendChild(cap);
    const thead = document.createElement("thead");
    const trh = document.createElement("tr");
    for (const h of t.headers){
      const th = document.createElement("th"); th.textContent = h; trh.appendChild(th);
    }
    thead.appendChild(trh); tb.appendChild(thead);
    const tbody = document.createElement("tbody");
    for (const row of t.rows){
      const tr = document.createElement("tr");
      for (const c of row){
        const td = document.createElement("td"); td.textContent = c; tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    tb.appendChild(tbody);
    box.appendChild(tb);
  }
  const grid = document.createElement("div");
  grid.className = "imggrid";
  for (const im of data.images || []){
    const fig = document.createElement("figure");
    const img = document.createElement("img");
    img.src = im.data; img.alt = im.title || ""; img.loading = "lazy";
    const cap = document.createElement("figcaption"); cap.textContent = im.title || "";
    fig.appendChild(img); fig.appendChild(cap);
    grid.appendChild(fig);
  }
  if (grid.children.length) box.appendChild(grid);
}

function renderDbTabs(){

function selectDbTab(i){
  if (i < 0 || i >= DB_TABLES.length) i = 0;
  DB_CURRENT = DB_TABLES[i].id;
  for (const b of document.querySelectorAll("#db-tabs .tab-btn"))
    b.classList.toggle("active", b.dataset.id === DB_CURRENT);
  const box = document.getElementById("db-content");
  box.innerHTML = "";
  box.appendChild(makeTable(DB_TABLES[i].table));
}

function makeTable(t){
  const wrap = document.createElement("div");
  wrap.style.cssText = "overflow:auto;max-width:100%";
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  for (const c of t.columns){
    const th = document.createElement("th");
    th.textContent = c; hr.appendChild(th);
  }
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = document.createElement("tbody");
  if (!t.rows.length){
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = Math.max(t.columns.length, 1);
    td.style.color = "var(--dim)"; td.textContent = "（空）";
    tr.appendChild(td); tbody.appendChild(tr);
  }
  for (const r of t.rows){
    const tr = document.createElement("tr");
    for (const v of r){
      const td = document.createElement("td");
      td.textContent = v === null || v === undefined ? "" : String(v);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

async function apiPost(path, body){

    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {})
  });

}

// 按检索词（配置名/模块名包含）过滤，且只列出与当前阶段同模块的 preset，最多显示 10 条
function renderStagePresetSel(q, sel, mid){
  const kw = (q.value || "").trim().toLowerCase();
  const mods = SCHEMA.modules;
  let list = MODULE_PRESETS.filter(p => p.module_id === mid);
  if (kw) list = list.filter(p =>
    p.name.toLowerCase().includes(kw) ||
    (mods[p.module_id] && mods[p.module_id].name.toLowerCase().includes(kw)));
  sel.innerHTML = "";
  for (const p of list.slice(0, 10)){
    const m = mods[p.module_id];
    const op = document.createElement("option");
    op.value = p.id;
    op.textContent = "[" + (m ? m.name : p.module_id) + "] " + p.name;
    sel.appendChild(op);
  }
  if (!sel.options.length){
    const op = document.createElement("option");
    op.value = ""; op.textContent = "(无匹配配置)";
    sel.appendChild(op);
  }
}

function addStage(mid, params, presetId, inputs){
  const m = SCHEMA.modules[mid];
  // 每个模块在一条链路中最多一个阶段：重复点击调色板不会新增重复阶段（防止误加）
  if (STAGES.some(s => s.module === mid)){
    alert("「" + (m ? m.name : mid) + "」已在链路中；每个模块只能有一个阶段，请直接修改该阶段参数。");
    return null;
  }
  const el = document.createElement("div");
  el.className = "stage";
  const head = document.createElement("div");
  head.className = "stage-head";
  const title = document.createElement("b");
  title.textContent = m ? m.name : mid;
  const btns = document.createElement("span");
  btns.className = "stage-btns";
  btns.innerHTML = '<button data-a="fold" title="收起/展开">▾</button>' +
    '<button data-a="up" title="上移">↑</button>' +
    '<button data-a="down" title="下移">↓</button>' +
    '<button data-a="del" class="del" title="删除">✕</button>';
  head.appendChild(title); head.appendChild(btns);
  el.appendChild(head);
  const pr = document.createElement("div");
  pr.className = "stage-preset";
  pr.innerHTML = '<input type="text" class="sp-q" placeholder="按配置名检索…">' +
    '<select class="sp-sel"></select>' +
    '<button type="button" data-a="preset-load" title="把选中配置的参数载入本阶段">载入</button>' +
    '<button type="button" data-a="preset-save" title="把本阶段参数保存为该模块配置（id 稳定）">保存</button>';
  const q = pr.querySelector(".sp-q"), sel = pr.querySelector(".sp-sel");
  renderStagePresetSel(q, sel, mid);
  q.addEventListener("input", () => renderStagePresetSel(q, sel, mid));
  el.appendChild(pr);
  if (m){
    const form = document.createElement("div");
    form.className = "stage-form";
    for (const [pk, spec] of Object.entries(m.params)){
      if (spec.test_only) continue;  // 测试参数不进链路阶段表单
      form.appendChild(field(pk, spec, "s" + STAGES.length + "-" + pk));
    }
    el.appendChild(form);
    applyShowIf(form);
    form.oninput = () => applyShowIf(form);
    form.onchange = () => applyShowIf(form);
  }
  // 输入连线（P5 第 2 步）：对本期已纳入解析的端口各渲染一个上游产物下拉（默认=现状）
  const wiring = document.createElement("div");
  wiring.className = "stage-wiring";
  el.appendChild(wiring);
  document.getElementById("dg-stages").appendChild(el);
  STAGES.push({module: mid, el, presetId: presetId || null, inputs: inputs || {}});
  if (params) fillForm(el, params);
  applyShowIf(el);
  renderWiring(el);
  return el;
}

// ---- 输入连线（产物端口协议，P5 第 2 步）----
// 本阶段上游已登记产物清单（{name, type}）：取各上游阶段 OUTPUTS ∩ SCHEMA.artifacts
// （artifacts = Pipe 实际登记的产物表，是唯一权威）。
function upstreamArtifacts(stageIndex){
  const arts = SCHEMA.artifacts || {};
  const out = [];
  for (let i = 0; i < stageIndex; i++){
    const mid = STAGES[i].module;
    const mod = SCHEMA.modules[mid];
    for (const [oname, otype] of Object.entries((mod && mod.outputs) || {})){
      const name = mid + "." + oname;
      if (name in arts) out.push({name, type: arts[name] || otype});
    }
  }
  return out;
}

// 渲染某阶段的「输入连线」区：只对 resolved_ports（后端 CHAIN_RESOLVED_PORTS：Pipeline.step
// 解析的端口 + 驱动层 vlm.dets）开放连线；未开放端口给出说明，不渲染下拉。
function renderWiring(stageEl){
  const box = stageEl.querySelector(".stage-wiring");
  if (!box) return;
  const idx = STAGES.findIndex(s => s.el === stageEl);
  if (idx < 0) return;
  const stage = STAGES[idx];
  const mod = SCHEMA.modules[stage.module] || {};
  const declared = mod.inputs || {};
  const resolved = mod.resolved_ports || [];
  const inputs = stage.inputs || {};
  box.innerHTML = "";
  if (!resolved.length){
    const keys = Object.keys(declared);
    if (keys.length){
      const note = document.createElement("div");
      note.className = "wiring-note";
      note.textContent = "输入端口（" + keys.join(" / ") +
        "）本期未开放连线，按默认取数——连线不影响运行。";
      box.appendChild(note);
    }
    return;
  }
  const ups = upstreamArtifacts(idx);
  const title = document.createElement("div");
  title.className = "wiring-title";
  title.textContent = "输入连线（缺省=现状规则）";
  box.appendChild(title);
  for (const port of resolved){
    const wantType = declared[port];
    const row = document.createElement("div");
    row.className = "wiring-row";
    const lab = document.createElement("label");
    lab.textContent = port + (wantType ? "（" + wantType + "）" : "");
    const sel = document.createElement("select");
    sel.dataset.port = port;
    const opDef = document.createElement("option");
    opDef.value = ""; opDef.textContent = "默认（现状）";
    sel.appendChild(opDef);
    for (const a of ups){
      if (wantType && a.type !== wantType) continue;  // 只列类型匹配的上游产物
      const op = document.createElement("option");
      op.value = a.name;
      op.textContent = a.name + "（" + a.type + "）";
      sel.appendChild(op);
    }
    sel.value = inputs[port] || "";
    // 选择回写 stage.inputs（随保存/运行流程走；空=删除该连线，回落默认）
    sel.addEventListener("change", () => {
      const i = STAGES.findIndex(s => s.el === stageEl);
      if (i < 0) return;
      const ins = STAGES[i].inputs || (STAGES[i].inputs = {});
      if (sel.value) ins[port] = sel.value;
      else delete ins[port];
      dgEstimate();
    });
    row.appendChild(lab); row.appendChild(sel);
    box.appendChild(row);
  }
}

function renderStages(list){
  const box = document.getElementById("dg-stages");
  box.innerHTML = "";
  STAGES = [];
  for (const s of list || []) addStage(s.module, s.params, s.preset_id, s.inputs);
}

async function saveStagePreset(i){
  const stage = STAGES[i];

  const moduleId = stage.module;
  const mod = SCHEMA.modules[moduleId];
  const params = collect(stage.el);
  // 绑定过 preset → 带 preset_id 定向更新（id 稳定，名称留空由后端沿用原名，不影响链路层）；
  // 未绑定 → 默认命名为模块名，按"同名覆盖/新建"落库并记录 id。
  const name = stage.presetId ? "" : (mod ? mod.name : moduleId);
  const payload = {kind: "module", name, module_id: moduleId, params};
  if (stage.presetId) payload.preset_id = stage.presetId;
  const data = await apiPost("/api/presets/save", payload);
  if (!data.ok){ alert("保存模块参数失败：" + (data.error || "")); return; }
  stage.presetId = data.id;
  alert((mod ? mod.name : moduleId) + (data.created ? "：已保存" : "：已覆盖"));
  dgEstimate();
  fetchModulePresets();
}

}

let dgTimer = null;
function dgEstimate(){
  const box = document.getElementById("dg-estimate");
  if (!STAGES.length){ box.innerHTML = ""; return; }
  clearTimeout(dgTimer);
  dgTimer = setTimeout(async () => {
    try{
      const r = await fetch("/api/pipeline/estimate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(dgBuildSpec())});
      const data = await r.json();
      if (!data.ok){
        box.innerHTML = '<pre class="err">' + esc(data.error || "估算失败") + "</pre>";
        return;
      }
      renderEstimate(data.estimate, box);
    }catch(e){
      box.innerHTML = '<pre class="err">' + esc("请求失败: " + e) + "</pre>";
    }
  }, 400);
}

async function stubBuild(){
  const data = await apiPost("/api/pipeline/build", dgBuildSpec());
  alert(data.note || data.error || "（占位）");
}

// ---- 挂载 agent：智能助手抽屉 ----
let AGENT_HISTORY = [];
function openAgent(){
  document.getElementById("agent-overlay").hidden = false;
  document.getElementById("agent-input").focus();
}
function closeAgent(){ document.getElementById("agent-overlay").hidden = true; }
function agentAppend(cls, text){
  const log = document.getElementById("agent-log");
  const d = document.createElement("div");
  d.className = "agent-msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
async function sendAgent(){
  const inp = document.getElementById("agent-input");
  const msg = inp.value.trim();
  if (!msg) return;
  const role = document.getElementById("agent-role").value;
  inp.value = "";
  agentAppend("user", msg);
  const btn = document.getElementById("agent-send");
  btn.disabled = true;
  const pending = agentAppend("meta", "思考中…");
  try{
    let message = msg;
    const sc = (document.getElementById("dg-scenario")?.value || "").trim();
    if (sc && AGENT_HISTORY.length === 0) message = msg + "\n\n[链路场景] " + sc;
    const data = await apiPost("/api/pipeline/agent",
      {role, message, history: AGENT_HISTORY});
    pending.remove();
    if (!data.ok){ agentAppend("err", data.error || "请求失败"); return; }
    const text = data.text || "（无文本回复）";
    agentAppend("assistant", text);
    if (data.tool_calls && data.tool_calls.length)
      agentAppend("meta", "工具调用：" + data.tool_calls.map(t => t.name).join(" → "));
    AGENT_HISTORY.push({role: "user", content: msg});
    AGENT_HISTORY.push({role: "assistant", content: text});
  }catch(e){
    pending.remove();
    agentAppend("err", "请求失败: " + e);
  }finally{
    btn.disabled = false;
    inp.focus();
  }
}

// ---- 命名配置：链路暂存 ----
function refreshPipelinePresets(){
  return fetch("/api/pipelines").then(r => r.json()).then(data => {
    const sel = document.getElementById("dg-preset-select");
    sel.innerHTML = "";
    if (!data.ok){
      const op = document.createElement("option");
      op.textContent = "(数据库不可用)";
      sel.appendChild(op);
      return;
    }
    for (const p of data.pipelines){
      const op = document.createElement("option");
      op.value = p.id; op.textContent = p.name;
      sel.appendChild(op);
    }
  }).catch(() => {});
}

async function savePipelinePreset(){
  const name = document.getElementById("dg-preset-name").value.trim();
  if (!name){ alert("请先填写链路配置名"); return; }

  // 每个阶段：有绑定 id → 更新该 preset（id 稳定不新建）；无绑定 → 新建并记下 id。
  // 命名统一为「链路名 · 模块名」，仅在新建时落库；既有 preset 若名字不一致也顺带归一。
  // 注意：直接用 STAGES（保有 el / presetId），snapshot() 只返回 {module, params} 会丢失二者。
  // 防御性去重：同一模块只保留首个阶段（后端亦拒绝重复模块，双保险）。
  const seenMods = new Set();
  const stages = STAGES.filter(s => {
    if (seenMods.has(s.module)) return false;
    seenMods.add(s.module);
    return true;
  });
  const steps = [];
  for (const stage of stages){
    const moduleId = stage.module;
    const stageEl = stage.el;
    const params = collect(stageEl);
    const presetName = (name + " · " + (SCHEMA.modules[moduleId].name || moduleId)).substring(0, 64);

    const payload = {
      kind: "module",
      name: presetName,
      module_id: moduleId,
      params: params
    };
    if (stage.presetId) payload.preset_id = stage.presetId;

    const presetData = await apiPost("/api/presets/save", payload);
    if (!presetData.ok){
      alert("保存模块参数失败：" + (presetData.error || ""));
      return;
    }
    stage.presetId = presetData.id;
    steps.push(presetData.id);
  }

  // 保存链路（steps 重建引用，不复制参数）
  // 端口连线（inputs）随链路存于 meta.stage_inputs（{module_id: {端口: 上游产物名}}），
  // 不改 pipeline_steps 表结构；载入时由后端回填到各阶段（见 db.load_pipeline）。
  const stage_inputs = {};
  for (const stage of stages){
    const ins = stage.inputs || {};
    if (Object.keys(ins).length) stage_inputs[stage.module] = ins;
  }
  const data = await apiPost("/api/pipelines/save", {
    name: name,
    steps: steps,
    streams: parseInt(document.getElementById("dg-streams").value) || 1,
    budget: {},
    meta: {description: document.getElementById("dg-scenario").value,
           stage_inputs: stage_inputs}
  });

  if (!data.ok){
    alert("保存链路失败：" + (data.error || ""));
    return;
  }

  alert(name + "：" + (data.note || "已保存"));
  refreshPipelinePresets();
}

async function loadPipelinePreset(){
  const sel = document.getElementById("dg-preset-select");
  if (!sel.value) return;
  const data = await apiPost("/api/pipelines/load", {id: sel.value});
  if (!data.ok){ alert("载入失败：" + (data.error || "")); return; }
  
  const pipeline = data.pipeline;
  document.getElementById("dg-preset-name").value = pipeline.name || "";
  document.getElementById("dg-streams").value = pipeline.streams || 1;
  const d = document.getElementById("dg-scenario");
  if (d) d.value = (pipeline.meta && pipeline.meta.description) || "";
  
  // 转换 stages 为前端需要的格式（inputs=端口连线，由后端从 meta.stage_inputs 回填）
  const stages = (pipeline.stages || []).map(s => ({
    module: s.module_id,
    params: s.params || {},
    preset_id: s.preset_id,
    inputs: s.inputs || {}
  }));

  renderStages(stages);
  dgEstimate();
}

async function deletePipelinePreset(){
  const sel = document.getElementById("dg-preset-select");
  if (!sel.value) return;
  const data = await apiPost("/api/pipelines/delete", {id: sel.value});
  if (!data.ok) alert("删除失败：" + (data.error || ""));
  refreshPipelinePresets();
}

// ---- 事件绑定 ----
document.getElementById("run").addEventListener("click", run);
document.getElementById("preset-save").addEventListener("click", saveModulePreset);
document.getElementById("preset-load").addEventListener("click", loadModulePreset);
document.getElementById("preset-delete").addEventListener("click", deleteModulePreset);
document.getElementById("dg-stages").addEventListener("click", e => {
  const btn = e.target.closest("button[data-a]");
  if (!btn) return;
  const stageEl = btn.closest(".stage");
  const i = STAGES.findIndex(s => s.el === stageEl);
  if (i < 0) return;
  const a = btn.dataset.a;
  if (a === "fold"){
    const f = stageEl.querySelector(".stage-form");
    if (f){ f.hidden = !f.hidden; btn.textContent = f.hidden ? "▸" : "▾"; }
    return;
  }
  if (a === "preset-load"){
    const sel = stageEl.querySelector(".sp-sel");
    if (!sel || !sel.value) return;
    apiPost("/api/presets/load", {id: sel.value}).then(d => {
      if (!d.ok){ alert("载入失败：" + (d.error || "")); return; }
      fillForm(stageEl, d.preset.params);
      STAGES[i].presetId = d.preset.id;  // 绑定：本阶段后续保存即更新该 preset
      dgEstimate();
    });
    return;
  }
  if (a === "preset-save"){
    saveStagePreset(i);
    return;
  }
  const list = snapshot();
  if (a === "del") list.splice(i, 1);
  else if (a === "up" && i > 0){ const t = list[i - 1]; list[i - 1] = list[i]; list[i] = t; }
  else if (a === "down" && i < list.length - 1){ const t = list[i + 1]; list[i + 1] = list[i]; list[i] = t; }
  renderStages(list);
  dgEstimate();
});
document.getElementById("dg-stages").addEventListener("input", dgEstimate);
document.getElementById("dg-streams").addEventListener("input", dgEstimate);
document.getElementById("dg-build-btn").addEventListener("click", stubBuild);
document.getElementById("dg-agent-btn").addEventListener("click", openAgent);
document.getElementById("dg-preset-save").addEventListener("click", savePipelinePreset);
document.getElementById("dg-preset-load").addEventListener("click", loadPipelinePreset);
document.getElementById("dg-preset-delete").addEventListener("click", deletePipelinePreset);

loadSchema();
</script>
